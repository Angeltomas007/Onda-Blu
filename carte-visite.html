<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Onda Blu — Carte de visite</title>
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@500;600;700&display=swap" rel="stylesheet">
<style>
  @page { size: 85mm 55mm; margin: 0; }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    font-family: 'Helvetica Neue', Arial, sans-serif;
    background: #dfe4e8;
  }
  .sheet {
    display: flex;
    flex-wrap: wrap;
    gap: 10mm;
    padding: 10mm;
  }
  .card {
    width: 85mm;
    height: 55mm;
    border-radius: 3mm;
    box-shadow: 0 6px 18px rgba(0,0,0,0.15);
    position: relative;
    overflow: hidden;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
  }

  .card-front {
    background: #0f4c75;
    color: #ffffff;
    gap: 4mm;
  }
  .card-front .logo-mark { width: 14mm; height: 14mm; }
  .card-front .brand {
    font-family: 'Cinzel', serif;
    font-weight: 600;
    letter-spacing: 0.14em;
    font-size: 13pt;
  }
  .card-front .tagline {
    font-size: 8pt;
    letter-spacing: 0.06em;
    opacity: 0.85;
  }

  .card-back {
    background: #ffffff;
    color: #0d2338;
    flex-direction: row;
    justify-content: space-between;
    padding: 6mm 7mm;
    gap: 4mm;
  }
  .card-back .info {
    display: flex;
    flex-direction: column;
    justify-content: center;
    gap: 2.5mm;
  }
  .card-back .service {
    font-family: 'Cinzel', serif;
    font-weight: 600;
    font-size: 9.5pt;
    letter-spacing: 0.04em;
    color: #0f4c75;
  }
  .card-back .phone {
    font-size: 10.5pt;
    font-weight: 700;
  }
  .card-back .note {
    font-size: 7pt;
    letter-spacing: 0.03em;
    color: #5b6b78;
  }
  .card-back .qr {
    width: 22mm;
    height: 22mm;
    flex-shrink: 0;
  }
  .card-back .qr img { display: block; width: 100%; height: 100%; }

  @media print {
    body { background: none; }
    .sheet { padding: 0; gap: 0; }
    .card { box-shadow: none; }
  }
</style>
</head>
<body>

<div class="sheet">

  <div class="card card-front">
    <svg class="logo-mark" viewBox="0 0 40 40" fill="none"><circle cx="20" cy="20" r="17" stroke="currentColor" stroke-width="1.5"/><path d="M5 24c3.3-4.3 6.7-4.3 10 0s6.7 4.3 10 0 6.7-4.3 10 0" stroke="currentColor" stroke-width="2.1" fill="none" stroke-linecap="round"/><path d="M5 16.5c3.3-4.3 6.7-4.3 10 0s6.7 4.3 10 0 6.7-4.3 10 0" stroke="currentColor" stroke-width="1.4" fill="none" stroke-linecap="round" opacity="0.5"/></svg>
    <span class="brand">ONDA BLU</span>
    <span class="tagline">TRAVEL CONCIERGE</span>
  </div>

  <div class="card card-back">
    <div class="info">
      <span class="service">Taxi · Van · Mediterranean</span>
      <span class="phone">+33 6 19 45 02 57</span>
      <span class="note">Disponible 24/7 — WhatsApp</span>
    </div>
    <div class="qr">
      <img src="assets/img/qr-contact.svg" alt="QR code WhatsApp Onda Blu">
    </div>
  </div>

</div>

</body>
</html>
