<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Onda Blu — Affiche WhatsApp</title>
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@500;600;700&display=swap" rel="stylesheet">
<style>
  @page { size: A5; margin: 0; }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    font-family: 'Helvetica Neue', Arial, sans-serif;
    background: #eef2f5;
  }
  .poster {
    width: 148mm;
    height: 210mm;
    margin: 10mm auto;
    background: #0f4c75;
    color: #ffffff;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: space-between;
    padding: 14mm 10mm;
    box-shadow: 0 10px 30px rgba(0,0,0,0.15);
  }
  .logo {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 4mm;
  }
  .logo-mark { width: 20mm; height: 20mm; }
  .brand {
    font-family: 'Cinzel', serif;
    font-weight: 600;
    letter-spacing: 0.12em;
    font-size: 20pt;
  }
  .tagline {
    font-size: 11pt;
    letter-spacing: 0.04em;
    opacity: 0.85;
    text-align: center;
  }
  .qr-block {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 6mm;
  }
  .qr-frame {
    background: #ffffff;
    padding: 6mm;
    border-radius: 4mm;
  }
  .qr-frame img, .qr-frame svg { display: block; width: 45mm; height: 45mm; }
  .cta {
    font-family: 'Cinzel', serif;
    font-weight: 600;
    font-size: 14pt;
    letter-spacing: 0.06em;
    text-align: center;
  }
  .cta small {
    display: block;
    font-family: 'Helvetica Neue', Arial, sans-serif;
    font-weight: 400;
    font-size: 10pt;
    letter-spacing: 0.02em;
    opacity: 0.85;
    margin-top: 2mm;
  }
  .contact {
    text-align: center;
    font-size: 11pt;
    letter-spacing: 0.03em;
  }
  .contact .phone { font-weight: 700; }

  @media print {
    body { background: none; }
    .poster { margin: 0; box-shadow: none; }
  }
</style>
</head>
<body>

<div class="poster">
  <div class="logo">
    <svg class="logo-mark" viewBox="0 0 40 40" fill="none"><circle cx="20" cy="20" r="17" stroke="currentColor" stroke-width="1.5"/><path d="M5 24c3.3-4.3 6.7-4.3 10 0s6.7 4.3 10 0 6.7-4.3 10 0" stroke="currentColor" stroke-width="2.1" fill="none" stroke-linecap="round"/><path d="M5 16.5c3.3-4.3 6.7-4.3 10 0s6.7 4.3 10 0 6.7-4.3 10 0" stroke="currentColor" stroke-width="1.4" fill="none" stroke-linecap="round" opacity="0.5"/></svg>
    <span class="brand">ONDA BLU</span>
    <span class="tagline">Taxi · Van · Transferts Méditerranée</span>
  </div>

  <div class="qr-block">
    <div class="qr-frame">
      <img src="assets/img/qr-contact.svg" alt="QR code WhatsApp Onda Blu">
    </div>
    <p class="cta">Scannez pour nous écrire<small>Réservation instantanée sur WhatsApp</small></p>
  </div>

  <div class="contact">
    <p class="phone">+33 6 19 45 02 57</p>
    <p>Disponible 24/7</p>
  </div>
</div>

</body>
</html>
