<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@600;700&display=swap" rel="stylesheet">
<style>
  * { box-sizing: border-box; }
  body {
    margin: 0;
    width: 1200px;
    height: 630px;
    background:
      radial-gradient(60% 60% at 22% 20%, rgba(90,150,200,0.22), transparent 60%),
      radial-gradient(55% 60% at 82% 80%, rgba(20,60,100,0.30), transparent 60%),
      linear-gradient(160deg, #071523 0%, #0b2a44 45%, #04101a 100%);
    font-family: 'Helvetica Neue', Arial, sans-serif;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    color: #fff;
  }
  .logo-mark { width: 84px; height: 84px; margin-bottom: 28px; }
  .brand {
    font-family: 'Cinzel', serif;
    font-weight: 700;
    letter-spacing: 0.16em;
    font-size: 52px;
    margin-bottom: 18px;
  }
  .tagline {
    font-size: 26px;
    letter-spacing: 0.02em;
    color: rgba(255,255,255,0.82);
    margin-bottom: 34px;
  }
  .pills {
    display: flex;
    gap: 14px;
  }
  .pill {
    border: 1px solid rgba(255,255,255,0.35);
    border-radius: 999px;
    padding: 10px 24px;
    font-size: 18px;
    letter-spacing: 0.03em;
    color: rgba(255,255,255,0.9);
  }
</style>
</head>
<body>
  <svg class="logo-mark" viewBox="0 0 40 40" fill="none"><circle cx="20" cy="20" r="17" stroke="currentColor" stroke-width="1.5"/><path d="M5 24c3.3-4.3 6.7-4.3 10 0s6.7 4.3 10 0 6.7-4.3 10 0" stroke="currentColor" stroke-width="2.1" fill="none" stroke-linecap="round"/><path d="M5 16.5c3.3-4.3 6.7-4.3 10 0s6.7 4.3 10 0 6.7-4.3 10 0" stroke="currentColor" stroke-width="1.4" fill="none" stroke-linecap="round" opacity="0.5"/></svg>
  <div class="brand">ONDA BLU</div>
  <div class="tagline">Your travel, handled for you.</div>
  <div class="pills">
    <span class="pill">Taxi</span>
    <span class="pill">Van</span>
    <span class="pill">Mediterranean</span>
  </div>
</body>
</html>
